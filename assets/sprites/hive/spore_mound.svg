<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 96 96">
  <!-- Spore mound: small hive satellite - a cluster of egg sacs on a fleshy
       base. Roughly 64px footprint. -->
  <!-- fleshy base -->
  <path d="M 16 62 Q 8 44 24 34 Q 40 20 62 28 Q 84 34 82 56 Q 80 76 58 80 Q 32 84 16 62 Z"
        fill="#5e1c36" stroke="#2b0a1c" stroke-width="3.5"/>
  <!-- egg sacs -->
  <g stroke="#2b0a1c" stroke-width="2.5">
    <ellipse cx="38" cy="44" rx="15" ry="17" fill="#8a3550"/>
    <ellipse cx="60" cy="52" rx="12" ry="13" fill="#7a2e4a"/>
    <ellipse cx="42" cy="64" rx="10" ry="9" fill="#7a2e4a"/>
  </g>
  <!-- embryo glows inside the sacs -->
  <ellipse cx="36" cy="42" rx="7" ry="9" fill="#c46a3a" opacity="0.75"/>
  <ellipse cx="59" cy="50" rx="5" ry="6" fill="#b85c34" opacity="0.7"/>
  <ellipse cx="41" cy="63" rx="4" ry="3.5" fill="#b85c34" opacity="0.6"/>
  <!-- curled larva silhouette in the big sac -->
  <path d="M 33 40 Q 39 36 40 42 Q 40 47 35 46" fill="none" stroke="#5e1c36" stroke-width="2.5" stroke-linecap="round"/>
  <!-- glisten highlights -->
  <ellipse cx="33" cy="36" rx="4" ry="2.5" fill="#d97a9a" opacity="0.6"/>
  <ellipse cx="56" cy="46" rx="3" ry="2" fill="#d97a9a" opacity="0.5"/>
</svg>
