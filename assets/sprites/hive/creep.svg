<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 256 256">
  <!-- Creep mat: organic ground covering spreading from the hive. Irregular
       fringed blob with veins and pustules; soft edges so overlapping mats
       and world ground blend. Semi-transparent overall - it tints the
       terrain rather than hiding it. -->
  <defs>
    <radialGradient id="mat" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3d1030" stop-opacity="0.92"/>
      <stop offset="62%" stop-color="#38102c" stop-opacity="0.82"/>
      <stop offset="86%" stop-color="#330e28" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2e0c24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- fringed edge lobes (behind the mat, fade outward) -->
  <g fill="#330e28" opacity="0.55">
    <ellipse cx="52" cy="70" rx="34" ry="24" transform="rotate(-30 52 70)"/>
    <ellipse cx="196" cy="58" rx="30" ry="20" transform="rotate(22 196 58)"/>
    <ellipse cx="228" cy="150" rx="26" ry="34" transform="rotate(10 228 150)"/>
    <ellipse cx="184" cy="216" rx="36" ry="22" transform="rotate(-16 184 216)"/>
    <ellipse cx="66" cy="204" rx="30" ry="24" transform="rotate(28 66 204)"/>
    <ellipse cx="26" cy="132" rx="22" ry="30" transform="rotate(-8 26 132)"/>
  </g>
  <!-- main mat -->
  <circle cx="128" cy="128" r="118" fill="url(#mat)"/>
  <!-- veins radiating from center -->
  <g fill="none" stroke="#5e1c40" stroke-width="5" stroke-linecap="round" opacity="0.75">
    <path d="M 128 128 Q 88 106 52 96"/>
    <path d="M 128 128 Q 150 88 172 66"/>
    <path d="M 128 128 Q 172 138 206 128"/>
    <path d="M 128 128 Q 140 176 128 208"/>
    <path d="M 128 128 Q 92 162 62 178"/>
    <path d="M 128 128 Q 100 88 92 56"/>
  </g>
  <g fill="none" stroke="#6e2a4c" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
    <path d="M 92 108 Q 76 100 64 102"/>
    <path d="M 160 90 Q 172 82 186 84"/>
    <path d="M 176 134 Q 188 144 190 156"/>
    <path d="M 130 176 Q 122 190 108 196"/>
    <path d="M 96 152 Q 84 160 80 172"/>
  </g>
  <!-- pustules and pores -->
  <g fill="#7a2e52" opacity="0.8">
    <circle cx="104" cy="92" r="6"/>
    <circle cx="168" cy="108" r="5"/>
    <circle cx="148" cy="168" r="7"/>
    <circle cx="84" cy="140" r="5"/>
    <circle cx="176" cy="182" r="4"/>
    <circle cx="66" cy="88" r="4"/>
  </g>
  <g fill="#a84a72" opacity="0.55">
    <circle cx="102" cy="90" r="2.5"/>
    <circle cx="166" cy="106" r="2"/>
    <circle cx="146" cy="166" r="3"/>
    <circle cx="82" cy="138" r="2"/>
  </g>
</svg>
