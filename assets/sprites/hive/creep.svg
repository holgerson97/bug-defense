<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 256 256">
  <!-- Creep mat, StarCraft-style: ONE solid ground color that fully covers
       the terrain, lumpy organic fringe, darker vein network on top.
       Overlapping mats read as a single continuous carpet because the fill
       is uniform and opaque. -->
  <!-- solid mat with lumpy edge lobes, all the same color -->
  <g fill="#4a1638">
    <circle cx="128" cy="128" r="112"/>
    <ellipse cx="52" cy="70" rx="36" ry="26" transform="rotate(-30 52 70)"/>
    <ellipse cx="196" cy="58" rx="32" ry="22" transform="rotate(22 196 58)"/>
    <ellipse cx="230" cy="148" rx="26" ry="36" transform="rotate(10 230 148)"/>
    <ellipse cx="186" cy="218" rx="38" ry="24" transform="rotate(-16 186 218)"/>
    <ellipse cx="64" cy="206" rx="32" ry="26" transform="rotate(28 64 206)"/>
    <ellipse cx="24" cy="132" rx="24" ry="32" transform="rotate(-8 24 132)"/>
    <ellipse cx="128" cy="26" rx="30" ry="20" transform="rotate(6 128 26)"/>
    <ellipse cx="118" cy="232" rx="28" ry="18" transform="rotate(-6 118 232)"/>
  </g>
  <!-- darker vein network (subtle, tone-on-tone) -->
  <g fill="none" stroke="#38102c" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <path d="M 128 128 Q 86 104 50 94"/>
    <path d="M 128 128 Q 152 86 174 62"/>
    <path d="M 128 128 Q 174 138 210 130"/>
    <path d="M 128 128 Q 140 178 130 210"/>
    <path d="M 128 128 Q 90 164 60 180"/>
    <path d="M 128 128 Q 102 86 94 54"/>
    <path d="M 128 128 Q 168 172 192 196"/>
  </g>
  <g fill="none" stroke="#38102c" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
    <path d="M 90 106 Q 74 98 60 100"/>
    <path d="M 162 88 Q 174 78 188 80"/>
    <path d="M 178 136 Q 192 146 196 158"/>
    <path d="M 132 178 Q 122 192 108 198"/>
    <path d="M 96 152 Q 82 160 78 172"/>
    <path d="M 168 178 Q 180 188 184 198"/>
  </g>
  <!-- sparse raised nodules (slightly lighter, same family) -->
  <g fill="#5c1d46" opacity="0.9">
    <circle cx="104" cy="92" r="7"/>
    <circle cx="170" cy="110" r="6"/>
    <circle cx="148" cy="170" r="8"/>
    <circle cx="82" cy="142" r="6"/>
    <circle cx="178" cy="184" r="5"/>
    <circle cx="64" cy="90" r="5"/>
    <circle cx="120" cy="206" r="5"/>
  </g>
</svg>
