<svg xmlns="http://www.w3.org/2000/svg" width="224" height="144" viewBox="0 0 112 72">
  <!-- Expansion drone: fat larva-carrier bug, top-down, facing right (+x).
       Fleshy crimson-purple grub hauling a glowing translucent egg sac (the
       seed of a new hive) on its back. Palette matches the hive set. -->
  <defs>
    <radialGradient id="sac" cx="0.45" cy="0.42" r="0.7">
      <stop offset="0%" stop-color="#ffb36b"/>
      <stop offset="45%" stop-color="#c46a3a"/>
      <stop offset="100%" stop-color="#6e2547"/>
    </radialGradient>
    <linearGradient id="grub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6e2547"/>
      <stop offset="55%" stop-color="#93395c"/>
      <stop offset="100%" stop-color="#a8496e"/>
    </linearGradient>
  </defs>

  <!-- stubby crawler legs -->
  <g stroke="#421430" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M 32 26 Q 24 18 20 12"/>
    <path d="M 32 46 Q 24 54 20 60"/>
    <path d="M 50 24 Q 44 14 42 8"/>
    <path d="M 50 48 Q 44 58 42 64"/>
    <path d="M 68 26 Q 66 16 68 10"/>
    <path d="M 68 46 Q 66 56 68 62"/>
  </g>

  <!-- fat segmented larva body -->
  <path d="M 12 36 Q 12 21 30 17 Q 52 11 76 17 Q 96 21 100 36
           Q 96 51 76 55 Q 52 61 30 55 Q 12 51 12 36 Z"
        fill="url(#grub)" stroke="#2b0a1c" stroke-width="3.5"/>
  <!-- segment folds -->
  <g fill="none" stroke="#421430" stroke-width="2.2" stroke-linecap="round">
    <path d="M 28 19 Q 32 36 28 53"/>
    <path d="M 42 16 Q 46 36 42 56"/>
    <path d="M 58 15 Q 62 36 58 57"/>
    <path d="M 72 17 Q 75 36 72 55"/>
  </g>
  <!-- tail nub -->
  <path d="M 13 30 Q 4 32 2 36 Q 4 40 13 42 Z" fill="#571a38" stroke="#2b0a1c" stroke-width="2.5"/>

  <!-- head -->
  <circle cx="95" cy="36" r="10" fill="#7a2a4e" stroke="#2b0a1c" stroke-width="3"/>
  <!-- bone mandibles -->
  <path d="M 102 30 Q 109 25 112 28 Q 108 32 103 34 Z" fill="#c9b08e" stroke="#4a3524" stroke-width="1.5"/>
  <path d="M 102 42 Q 109 47 112 44 Q 108 40 103 38 Z" fill="#c9b08e" stroke="#4a3524" stroke-width="1.5"/>
  <!-- dull worker eyes -->
  <circle cx="98" cy="31" r="2" fill="#ffcf5e"/>
  <circle cx="98" cy="41" r="2" fill="#ffcf5e"/>

  <!-- glowing egg sac riding the back -->
  <ellipse cx="45" cy="36" rx="21" ry="16" fill="url(#sac)" stroke="#2b0a1c" stroke-width="3"/>
  <!-- membrane veins -->
  <g fill="none" stroke="#93395c" stroke-width="1.8" opacity="0.7" stroke-linecap="round">
    <path d="M 30 30 Q 45 23 60 30"/>
    <path d="M 28 40 Q 45 49 62 40"/>
    <path d="M 45 21 Q 46 36 45 51"/>
  </g>
  <!-- larvae eggs glowing inside -->
  <g fill="#ffe0b0" opacity="0.9">
    <circle cx="39" cy="31" r="4"/>
    <circle cx="51" cy="29" r="3.4"/>
    <circle cx="45" cy="41" r="3.8"/>
    <circle cx="55" cy="40" r="2.8"/>
    <circle cx="34" cy="40" r="2.6"/>
  </g>
  <g fill="#fff4de" opacity="0.85">
    <circle cx="38" cy="29.5" r="1.5"/>
    <circle cx="44" cy="39.5" r="1.4"/>
    <circle cx="50" cy="28" r="1.2"/>
  </g>

  <!-- wet flesh highlight -->
  <ellipse cx="78" cy="25" rx="8" ry="3.5" fill="#d97a9a" opacity="0.6" transform="rotate(-12 78 25)"/>
</svg>
