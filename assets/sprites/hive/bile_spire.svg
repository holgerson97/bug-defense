<svg xmlns="http://www.w3.org/2000/svg" width="192" height="320" viewBox="0 0 96 160">
  <!-- Bile spire: a TALL organic tower. Faked height for top-down: fleshy
       root base at the BOTTOM (the footprint, node origin belongs there),
       tapering chitin trunk rising "up" the sprite with stacked segment
       rings, a venting maw at the tip, cast shadow to the lower-right.
       The scene offsets the sprite so the base sits on the ground cell. -->
  <defs>
    <linearGradient id="trunk" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#571a38"/>
      <stop offset="55%" stop-color="#6e2547"/>
      <stop offset="100%" stop-color="#93395c"/>
    </linearGradient>
  </defs>
  <!-- cast shadow -->
  <ellipse cx="62" cy="140" rx="30" ry="10" fill="#000000" opacity="0.25"/>
  <!-- root base: fleshy mound gripping the creep -->
  <path d="M 12 136 Q 8 120 24 114 Q 34 104 48 106 Q 64 104 72 114 Q 86 120 82 136
           Q 78 150 48 152 Q 18 150 12 136 Z"
        fill="#4a1638" stroke="#2b0a1c" stroke-width="4"/>
  <g fill="none" stroke="#38102c" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M 20 132 Q 34 140 48 140"/>
    <path d="M 76 130 Q 62 138 50 139"/>
  </g>
  <!-- trunk: tapering, leaning slightly, stacked segments -->
  <path d="M 32 122 Q 28 96 34 72 Q 38 48 46 28 Q 50 14 54 10
           Q 60 16 62 30 Q 68 54 66 80 Q 66 104 62 124 Q 48 132 32 122 Z"
        fill="url(#trunk)" stroke="#2b0a1c" stroke-width="4" stroke-linejoin="round"/>
  <!-- segment rings climbing the trunk -->
  <g fill="none" stroke="#3d1129" stroke-width="3" stroke-linecap="round">
    <path d="M 33 112 Q 48 120 62 112"/>
    <path d="M 33 94 Q 48 102 65 94"/>
    <path d="M 35 76 Q 50 84 66 76"/>
    <path d="M 38 58 Q 52 65 64 58"/>
    <path d="M 42 42 Q 53 48 61 42"/>
    <path d="M 46 28 Q 54 33 59 28"/>
  </g>
  <!-- dorsal glow strand -->
  <path d="M 40 118 Q 40 70 50 22" fill="none" stroke="#c46a3a" stroke-width="2.5" opacity="0.7" stroke-linecap="round"/>
  <!-- pustules on the trunk -->
  <g stroke="#2b0a1c" stroke-width="1.8">
    <circle cx="56" cy="88" r="5" fill="#b85c34"/>
    <circle cx="44" cy="56" r="4" fill="#b85c34"/>
  </g>
  <circle cx="54.5" cy="86.5" r="2.2" fill="#ffb36b" opacity="0.9"/>
  <circle cx="43" cy="54.5" r="1.7" fill="#ffb36b" opacity="0.85"/>
  <!-- bone collar under the tip -->
  <path d="M 44 22 Q 54 28 62 22 L 60 30 Q 53 34 46 30 Z"
        fill="#c9b08e" stroke="#4a3524" stroke-width="2.5"/>
  <!-- venting tip maw -->
  <ellipse cx="54" cy="14" rx="9" ry="7" fill="#7a2a4e" stroke="#2b0a1c" stroke-width="3"/>
  <ellipse cx="54" cy="13" rx="4.5" ry="3.5" fill="#12040c"/>
  <!-- bile drip -->
  <circle cx="60" cy="20" r="2.2" fill="#9fae3a" opacity="0.9"/>
  <circle cx="63" cy="26" r="1.4" fill="#9fae3a" opacity="0.7"/>
</svg>
