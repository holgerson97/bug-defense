<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 96 96">
  <!-- Bile spire: small hive satellite - a twisted chitin spike seen from
       above, venting sickly gas. Roughly 56px footprint. -->
  <!-- base flesh ring -->
  <ellipse cx="48" cy="50" rx="30" ry="27" fill="#471530" stroke="#2b0a1c" stroke-width="3.5"/>
  <path d="M 24 40 Q 48 28 72 40" fill="none" stroke="#5e1c36" stroke-width="4" stroke-linecap="round"/>
  <!-- spiral chitin spike rising toward the viewer -->
  <g stroke="#2b0a1c" stroke-width="3">
    <ellipse cx="48" cy="48" rx="21" ry="19" fill="#6b2440"/>
    <ellipse cx="48" cy="46" rx="14" ry="12.5" fill="#8a3550"/>
    <ellipse cx="48" cy="44" rx="8" ry="7" fill="#a84a66"/>
  </g>
  <!-- spiral ridge lines -->
  <path d="M 30 54 Q 48 62 66 52" fill="none" stroke="#471530" stroke-width="3" stroke-linecap="round"/>
  <path d="M 36 50 Q 50 56 62 48" fill="none" stroke="#471530" stroke-width="2.5" stroke-linecap="round"/>
  <!-- vent maw at the tip -->
  <ellipse cx="48" cy="43" rx="4 " ry="3.5" fill="#1c0611"/>
  <!-- bile drips -->
  <circle cx="54" cy="40" r="2" fill="#9fae3a" opacity="0.85"/>
  <circle cx="44" cy="39" r="1.5" fill="#9fae3a" opacity="0.7"/>
  <!-- highlight -->
  <ellipse cx="42" cy="41" rx="4" ry="2.5" fill="#d97a9a" opacity="0.55"/>
</svg>
