<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 96 96">
  <!-- Crystal ore: irregular rock with jutting shards and a baked glow halo -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a86ef0" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#a86ef0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a86ef0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9b8ff"/>
      <stop offset="55%" stop-color="#9a5ce0"/>
      <stop offset="100%" stop-color="#6a34a8"/>
    </linearGradient>
  </defs>
  <circle cx="48" cy="50" r="46" fill="url(#glow)"/>
  <!-- rock base, irregular -->
  <path d="M 22 62 L 14 52 L 20 40 L 32 36 L 46 30 L 62 34 L 74 42 L 80 54 L 74 66 L 60 72 L 40 74 L 28 70 Z"
        fill="#3a3050" stroke="#241c36" stroke-width="2.5"/>
  <path d="M 22 62 L 30 58 L 44 62 L 58 58 L 74 66 L 60 72 L 40 74 L 28 70 Z" fill="#2c2440"/>
  <!-- shards -->
  <path d="M 40 52 L 32 24 L 46 14 L 52 30 L 50 52 Z" fill="url(#shard)" stroke="#241c36" stroke-width="2"/>
  <path d="M 42 50 L 44 22 L 47 18 L 46 48 Z" fill="#e8d4ff" opacity="0.8"/>
  <path d="M 52 54 L 62 26 L 72 36 L 64 56 Z" fill="url(#shard)" stroke="#241c36" stroke-width="2"/>
  <path d="M 56 52 L 64 30 L 67 34 L 60 54 Z" fill="#c9a2f5" opacity="0.7"/>
  <path d="M 26 56 L 20 42 L 32 38 L 36 54 Z" fill="url(#shard)" stroke="#241c36" stroke-width="2"/>
  <path d="M 28 54 L 24 43 L 28 41 L 32 53 Z" fill="#e8d4ff" opacity="0.6"/>
  <!-- small front shard -->
  <path d="M 58 62 L 66 50 L 72 58 L 66 66 Z" fill="url(#shard)" stroke="#241c36" stroke-width="1.8"/>
  <!-- glints -->
  <circle cx="44" cy="20" r="1.6" fill="#ffffff" opacity="0.9"/>
  <circle cx="68" cy="34" r="1.3" fill="#ffffff" opacity="0.8"/>
</svg>
