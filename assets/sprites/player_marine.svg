<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 96 96">
  <!-- Space marine, top-down, facing right (+x). Rifle along the centerline. -->
  <!-- thruster glow -->
  <ellipse cx="14" cy="41" rx="6" ry="3.2" fill="#7fd4ff" opacity="0.75"/>
  <ellipse cx="14" cy="55" rx="6" ry="3.2" fill="#7fd4ff" opacity="0.75"/>
  <!-- backpack -->
  <rect x="15" y="31" width="17" height="34" rx="5" fill="#2c5570" stroke="#173447" stroke-width="2"/>
  <line x1="23.5" y1="34" x2="23.5" y2="62" stroke="#173447" stroke-width="1.5"/>
  <!-- rifle -->
  <rect x="52" y="44" width="26" height="8" rx="2" fill="#3a3f47" stroke="#20242a" stroke-width="1.5"/>
  <rect x="72" y="42.5" width="6" height="11" rx="1.5" fill="#20242a"/>
  <rect x="55" y="42" width="7" height="12" rx="2" fill="#2c3138"/>
  <!-- arms gripping the rifle -->
  <rect x="44" y="33" width="16" height="8" rx="4" fill="#2c5570" stroke="#173447" stroke-width="1.6" transform="rotate(24 44 37)"/>
  <rect x="44" y="55" width="16" height="8" rx="4" fill="#2c5570" stroke="#173447" stroke-width="1.6" transform="rotate(-24 44 59)"/>
  <!-- pauldrons -->
  <ellipse cx="39" cy="29" rx="14" ry="9.5" fill="#3b7fa8" stroke="#173447" stroke-width="2"/>
  <ellipse cx="39" cy="67" rx="14" ry="9.5" fill="#3b7fa8" stroke="#173447" stroke-width="2"/>
  <ellipse cx="42" cy="28" rx="7" ry="4.5" fill="#66b8e0"/>
  <ellipse cx="42" cy="68" rx="7" ry="4.5" fill="#66b8e0"/>
  <path d="M 30 25 L 34 22 L 36 26" fill="none" stroke="#ffd93b" stroke-width="2"/>
  <!-- torso armor -->
  <ellipse cx="43" cy="48" rx="17" ry="15" fill="#41678a" stroke="#173447" stroke-width="2"/>
  <!-- chest plate chevrons -->
  <path d="M 34 42 L 44 48 L 34 54" fill="none" stroke="#2c5570" stroke-width="3"/>
  <path d="M 42 40 L 52 48 L 42 56" fill="none" stroke="#66b8e0" stroke-width="2.5"/>
  <!-- helmet -->
  <circle cx="58" cy="48" r="10" fill="#3b7fa8" stroke="#173447" stroke-width="2"/>
  <path d="M 58 39 A 9.2 9.2 0 0 1 58 57" fill="none" stroke="#2c5570" stroke-width="3"/>
  <!-- visor glow strip -->
  <path d="M 64.5 43 A 8 8 0 0 1 64.5 53" fill="none" stroke="#4fe8e0" stroke-width="2.6"/>
  <!-- helmet crest -->
  <line x1="50" y1="48" x2="56" y2="48" stroke="#ffd93b" stroke-width="2"/>
</svg>
