<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 30 30">
  <!-- Solar panel: blue photovoltaic cell grid in a steel frame, 30px footprint -->
  <rect x="0.8" y="0.8" width="28.4" height="28.4" rx="2.5" fill="#596673" stroke="#2e3742" stroke-width="1.6"/>
  <!-- cell area -->
  <rect x="3.6" y="3.6" width="22.8" height="22.8" rx="1" fill="#1d4e89" stroke="#0e2a4d" stroke-width="1.4"/>
  <!-- cell grid -->
  <g stroke="#4a86c8" stroke-width="1.1">
    <line x1="11.2" y1="4" x2="11.2" y2="26"/>
    <line x1="18.8" y1="4" x2="18.8" y2="26"/>
    <line x1="4" y1="11.2" x2="26" y2="11.2"/>
    <line x1="4" y1="18.8" x2="26" y2="18.8"/>
  </g>
  <!-- diagonal sheen -->
  <path d="M 6 10.5 L 12.5 4.2 L 16.5 4.2 L 6 14.5 Z" fill="#7fb7ef" opacity="0.4"/>
  <path d="M 8.5 19 L 23 4.8 L 25 6.6 L 10.5 21 Z" fill="#7fb7ef" opacity="0.22"/>
  <!-- frame screws -->
  <circle cx="2.6" cy="2.6" r="0.9" fill="#8a97a5"/>
  <circle cx="27.4" cy="2.6" r="0.9" fill="#8a97a5"/>
  <circle cx="2.6" cy="27.4" r="0.9" fill="#8a97a5"/>
  <circle cx="27.4" cy="27.4" r="0.9" fill="#8a97a5"/>
  <!-- charge indicator -->
  <circle cx="26" cy="26" r="1.6" fill="#ffd93b" stroke="#0e2a4d" stroke-width="0.9"/>
</svg>
