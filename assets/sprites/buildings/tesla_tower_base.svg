<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 40 40">
  <!-- Tesla tower: dark housing with copper coil seen from above, 40px footprint -->
  <rect x="1" y="1" width="38" height="38" rx="4" fill="#2e3342" stroke="#14171f" stroke-width="2"/>
  <rect x="5" y="5" width="30" height="30" rx="2.5" fill="#3a4152" stroke="#14171f" stroke-width="1.5"/>
  <!-- hazard corner stripes -->
  <path d="M 5.5 10 L 10 5.5 L 13 5.5 L 5.5 13 Z" fill="#ffd93b" opacity="0.8"/>
  <path d="M 34.5 30 L 30 34.5 L 27 34.5 L 34.5 27 Z" fill="#ffd93b" opacity="0.8"/>
  <!-- insulator ring -->
  <circle cx="20" cy="20" r="12.5" fill="#232838" stroke="#14171f" stroke-width="1.8"/>
  <!-- copper coil windings -->
  <circle cx="20" cy="20" r="10" fill="#8a5424" stroke="#14171f" stroke-width="1.5"/>
  <circle cx="20" cy="20" r="8.6" fill="none" stroke="#c77f3d" stroke-width="1.4"/>
  <circle cx="20" cy="20" r="6.8" fill="none" stroke="#c77f3d" stroke-width="1.4"/>
  <circle cx="20" cy="20" r="5" fill="none" stroke="#c77f3d" stroke-width="1.4"/>
  <!-- electrode cap -->
  <circle cx="20" cy="20" r="3.6" fill="#ebb866" stroke="#8a5424" stroke-width="1.3"/>
  <circle cx="18.9" cy="18.9" r="1.2" fill="#fff3d6"/>
  <!-- arc gap studs at ring edge -->
  <circle cx="20" cy="8.6" r="1.3" fill="#bff2ff"/>
  <circle cx="31.4" cy="20" r="1.3" fill="#bff2ff"/>
  <circle cx="20" cy="31.4" r="1.3" fill="#bff2ff"/>
  <circle cx="8.6" cy="20" r="1.3" fill="#bff2ff"/>
  <!-- coil sheen -->
  <path d="M 12.4 15.5 A 8.8 8.8 0 0 1 16.5 11.9" fill="none" stroke="#ebb866" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>
</svg>
