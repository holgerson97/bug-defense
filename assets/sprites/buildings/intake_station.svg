<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 54 54">
  <!-- Intake station: steel burner block, 54px footprint. Furnace mouth with fire, crystal hopper, intake grate, corner chimney stack (smoke spawns there). -->
  <rect x="1.5" y="1.5" width="51" height="51" rx="3" fill="#5a6572" stroke="#2c3540" stroke-width="2.4"/>
  <rect x="6" y="6" width="42" height="42" rx="2" fill="#49535f" stroke="#2c3540" stroke-width="1.6"/>
  <!-- corner rivets -->
  <circle cx="4.4" cy="4.4" r="1.2" fill="#8ca6bf"/>
  <circle cx="49.6" cy="4.4" r="1.2" fill="#8ca6bf"/>
  <circle cx="4.4" cy="49.6" r="1.2" fill="#8ca6bf"/>
  <circle cx="49.6" cy="49.6" r="1.2" fill="#8ca6bf"/>
  <!-- furnace block -->
  <rect x="9" y="13" width="26" height="27" rx="2" fill="#6b7480" stroke="#2c3540" stroke-width="2"/>
  <path d="M 11 15 L 33 15 L 33 18 L 11 18 Z" fill="#7d8894" opacity="0.8"/>
  <!-- furnace mouth with fire -->
  <rect x="13" y="21" width="18" height="14" rx="1.5" fill="#1c232c" stroke="#2c3540" stroke-width="1.4"/>
  <path d="M 15 34 L 18 26 L 20.5 30 L 23 24.5 L 25.5 29.5 L 28 27 L 29 34 Z" fill="#ff9a3d"/>
  <path d="M 18.5 34 L 21.5 28.5 L 23.5 31.5 L 25.5 29.5 L 26 34 Z" fill="#ffd93b"/>
  <!-- crystal hopper (the intake) -->
  <rect x="9" y="42" width="22" height="8.5" rx="1.5" fill="#39434f" stroke="#2c3540" stroke-width="1.4"/>
  <path d="M 12.5 49.5 L 14.6 44.5 L 16.7 49.5 Z" fill="#7ad9f2" stroke="#2b6f86" stroke-width="0.9"/>
  <path d="M 17.5 49.5 L 19.8 43.8 L 22.1 49.5 Z" fill="#9ae4f8" stroke="#2b6f86" stroke-width="0.9"/>
  <path d="M 23 49.5 L 25 45.2 L 27 49.5 Z" fill="#7ad9f2" stroke="#2b6f86" stroke-width="0.9"/>
  <!-- intake grate -->
  <rect x="38" y="26" width="10" height="20" rx="1.5" fill="#39434f" stroke="#2c3540" stroke-width="1.4"/>
  <line x1="40.6" y1="28" x2="40.6" y2="44" stroke="#2c3540" stroke-width="1.2"/>
  <line x1="43" y1="28" x2="43" y2="44" stroke="#2c3540" stroke-width="1.2"/>
  <line x1="45.4" y1="28" x2="45.4" y2="44" stroke="#2c3540" stroke-width="1.2"/>
  <!-- pipe from furnace to chimney -->
  <rect x="33" y="15" width="6" height="4.4" fill="#4a545f" stroke="#2c3540" stroke-width="1.2"/>
  <!-- chimney stack -->
  <circle cx="40" cy="14" r="7" fill="#4a545f" stroke="#2c3540" stroke-width="2"/>
  <circle cx="40" cy="14" r="3.6" fill="#1c232c"/>
  <circle cx="42" cy="12" r="1" fill="#8ca6bf" opacity="0.6"/>
</svg>
