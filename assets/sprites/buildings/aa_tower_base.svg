<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 40 40">
  <!-- AA tower base: WW2 flak platform — octagonal steel deck with tread plate, 40px footprint -->
  <path d="M 7 1.5 L 33 1.5 L 38.5 7 L 38.5 33 L 33 38.5 L 7 38.5 L 1.5 33 L 1.5 7 Z"
        fill="#737880" stroke="#33373d" stroke-width="2"/>
  <path d="M 9 5 L 31 5 L 35 9 L 35 31 L 31 35 L 9 35 L 5 31 L 5 9 Z"
        fill="#5c6168" stroke="#33373d" stroke-width="1.6"/>
  <!-- tread plate hatching -->
  <g stroke="#4a4f56" stroke-width="1.3" stroke-linecap="round">
    <line x1="9" y1="8.5" x2="12.5" y2="12"/>
    <line x1="15" y1="7" x2="18.5" y2="10.5"/>
    <line x1="21.5" y1="7" x2="25" y2="10.5"/>
    <line x1="28" y1="7" x2="31.5" y2="10.5"/>
    <line x1="7" y1="15" x2="10.5" y2="18.5"/>
    <line x1="7" y1="21.5" x2="10.5" y2="25"/>
    <line x1="8.5" y1="29" x2="12" y2="32.5"/>
    <line x1="15" y1="29.5" x2="18.5" y2="33"/>
    <line x1="21.5" y1="29.5" x2="25" y2="33"/>
    <line x1="28" y1="29.5" x2="31.2" y2="32.7"/>
    <line x1="29.5" y1="15" x2="33" y2="18.5"/>
    <line x1="29.5" y1="21.5" x2="33" y2="25"/>
  </g>
  <!-- turntable ring -->
  <circle cx="20" cy="20" r="10.5" fill="#4a4f56" stroke="#33373d" stroke-width="1.8"/>
  <circle cx="20" cy="20" r="7.5" fill="#3d4147"/>
  <!-- ring bolts -->
  <circle cx="20" cy="11" r="1" fill="#9aa1a8"/>
  <circle cx="26.4" cy="13.6" r="1" fill="#9aa1a8"/>
  <circle cx="29" cy="20" r="1" fill="#9aa1a8"/>
  <circle cx="26.4" cy="26.4" r="1" fill="#9aa1a8"/>
  <circle cx="20" cy="29" r="1" fill="#9aa1a8"/>
  <circle cx="13.6" cy="26.4" r="1" fill="#9aa1a8"/>
  <circle cx="11" cy="20" r="1" fill="#9aa1a8"/>
  <circle cx="13.6" cy="13.6" r="1" fill="#9aa1a8"/>
  <!-- outrigger lugs at the diagonals -->
  <rect x="3" y="3" width="4" height="4" rx="1" fill="#33373d"/>
  <rect x="33" y="3" width="4" height="4" rx="1" fill="#33373d"/>
  <rect x="3" y="33" width="4" height="4" rx="1" fill="#33373d"/>
  <rect x="33" y="33" width="4" height="4" rx="1" fill="#33373d"/>
  <!-- deck highlight -->
  <path d="M 9.5 3.5 L 30.5 3.5" stroke="#9aa1a8" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>
</svg>
