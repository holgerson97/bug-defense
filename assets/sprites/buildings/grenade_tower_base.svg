<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 40 40">
  <!-- Grenade tower: olive mortar pit with sandbag hex ring and up-facing tube, 40px footprint -->
  <rect x="1" y="1" width="38" height="38" rx="4" fill="#737f52" stroke="#3d452a" stroke-width="2"/>
  <!-- dirt pit floor -->
  <rect x="5" y="5" width="30" height="30" rx="2.5" fill="#5f6a42"/>
  <!-- sandbag hex ring -->
  <path d="M 12 5.5 L 28 5.5 L 35.5 20 L 28 34.5 L 12 34.5 L 4.5 20 Z"
        fill="#99a866" stroke="#3d452a" stroke-width="2"/>
  <!-- sandbag segment seams -->
  <g stroke="#6b7845" stroke-width="1.6">
    <line x1="20" y1="5.5" x2="20" y2="9.5"/>
    <line x1="31.8" y1="12.8" x2="28.2" y2="14.8"/>
    <line x1="31.8" y1="27.2" x2="28.2" y2="25.2"/>
    <line x1="20" y1="34.5" x2="20" y2="30.5"/>
    <line x1="8.2" y1="27.2" x2="11.8" y2="25.2"/>
    <line x1="8.2" y1="12.8" x2="11.8" y2="14.8"/>
  </g>
  <!-- inner pit shadow -->
  <path d="M 13.5 9 L 26.5 9 L 32.5 20 L 26.5 31 L 13.5 31 L 7.5 20 Z" fill="#4d5634"/>
  <!-- mortar tube seen from above -->
  <circle cx="20" cy="20" r="8" fill="#383f29" stroke="#23281a" stroke-width="2"/>
  <circle cx="20" cy="20" r="4.6" fill="#1f2418"/>
  <path d="M 15.2 15.6 A 6.4 6.4 0 0 1 23 14.2" fill="none" stroke="#c2cf8f" stroke-width="1.8" stroke-linecap="round"/>
  <!-- spare shells -->
  <circle cx="29.5" cy="29.5" r="2" fill="#383f29" stroke="#c2cf8f" stroke-width="0.9"/>
  <circle cx="33" cy="26.5" r="2" fill="#383f29" stroke="#c2cf8f" stroke-width="0.9"/>
  <!-- highlight -->
  <path d="M 13 6.8 L 27 6.8" stroke="#c2cf8f" stroke-width="1.3" stroke-linecap="round" opacity="0.5"/>
</svg>
