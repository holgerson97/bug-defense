<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 40 40">
  <!-- Repair tower: teal panel, light-green medical cross, central emitter dish, 40px footprint -->
  <rect x="1" y="1" width="38" height="38" rx="4" fill="#478070" stroke="#23443a" stroke-width="2"/>
  <rect x="5" y="5" width="30" height="30" rx="2.5" fill="#3a6a5c" stroke="#23443a" stroke-width="1.5"/>
  <!-- medical cross -->
  <path d="M 15.5 7 L 24.5 7 L 24.5 15.5 L 33 15.5 L 33 24.5 L 24.5 24.5 L 24.5 33 L 15.5 33 L 15.5 24.5 L 7 24.5 L 7 15.5 L 15.5 15.5 Z"
        fill="#73f2a6" stroke="#23443a" stroke-width="2"/>
  <path d="M 17 8.5 L 20 8.5 L 20 17 L 17 17 Z" fill="#c8ffdf" opacity="0.75"/>
  <!-- emitter dish -->
  <circle cx="20" cy="20" r="7.2" fill="#2c4f44" stroke="#23443a" stroke-width="1.8"/>
  <circle cx="20" cy="20" r="4.8" fill="#63d694" stroke="#2c4f44" stroke-width="1.2"/>
  <circle cx="20" cy="20" r="1.8" fill="#eafff2"/>
  <path d="M 15.4 17 A 5.4 5.4 0 0 1 19 14.7" fill="none" stroke="#c8ffdf" stroke-width="1.4" stroke-linecap="round"/>
  <!-- corner bolts -->
  <circle cx="4.6" cy="4.6" r="1.2" fill="#8fd9b8"/>
  <circle cx="35.4" cy="4.6" r="1.2" fill="#8fd9b8"/>
  <circle cx="4.6" cy="35.4" r="1.2" fill="#8fd9b8"/>
  <circle cx="35.4" cy="35.4" r="1.2" fill="#8fd9b8"/>
</svg>
