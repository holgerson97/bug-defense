<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 40 40">
  <!-- Flame tower base: rust platform, fuel tank on the left, central nozzle mount, 40px footprint -->
  <rect x="1" y="1" width="38" height="38" rx="4" fill="#6b4d3d" stroke="#38281f" stroke-width="2"/>
  <rect x="5" y="5" width="30" height="30" rx="2.5" fill="#5a4033" stroke="#38281f" stroke-width="1.5"/>
  <!-- scorch marks -->
  <circle cx="30" cy="10.5" r="3" fill="#38281f" opacity="0.55"/>
  <circle cx="31.5" cy="29" r="2.2" fill="#38281f" opacity="0.45"/>
  <!-- fuel line from tank to mount -->
  <path d="M 12 20 L 17 20" stroke="#38281f" stroke-width="3" stroke-linecap="round"/>
  <!-- fuel tank (vertical cylinder, top view side pod) -->
  <rect x="5.5" y="10" width="7.5" height="20" rx="3.4" fill="#bf5926" stroke="#38281f" stroke-width="1.8"/>
  <rect x="6.5" y="17.5" width="5.5" height="5" fill="#ffc247"/>
  <path d="M 7 12 L 11.5 12" stroke="#e8834c" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="9.25" cy="27" r="1.4" fill="#38281f"/>
  <!-- nozzle mount ring -->
  <circle cx="20" cy="20" r="9" fill="#473429" stroke="#38281f" stroke-width="1.8"/>
  <circle cx="20" cy="20" r="6" fill="#38281f"/>
  <!-- mount bolts -->
  <circle cx="20" cy="12.6" r="1" fill="#9a7a61"/>
  <circle cx="27.4" cy="20" r="1" fill="#9a7a61"/>
  <circle cx="20" cy="27.4" r="1" fill="#9a7a61"/>
  <circle cx="12.6" cy="20" r="1" fill="#9a7a61"/>
  <!-- corner bolts -->
  <circle cx="4.6" cy="4.6" r="1.2" fill="#9a7a61"/>
  <circle cx="35.4" cy="4.6" r="1.2" fill="#9a7a61"/>
  <circle cx="4.6" cy="35.4" r="1.2" fill="#9a7a61"/>
  <circle cx="35.4" cy="35.4" r="1.2" fill="#9a7a61"/>
</svg>
