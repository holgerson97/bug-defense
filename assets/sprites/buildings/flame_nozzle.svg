<svg xmlns="http://www.w3.org/2000/svg" width="128" height="80" viewBox="0 0 64 40">
  <!-- Flamethrower nozzle, pivot at (32,20), pointing +x. Flared mouth ends at x=54 (= +22 from pivot, where the Jet particles sit). -->
  <!-- flared burner mouth -->
  <path d="M 44 17 L 51 15 L 54 16.4 L 54 23.6 L 51 25 L 44 23 Z" fill="#3a2f26" stroke="#221a14" stroke-width="1.6"/>
  <line x1="51.5" y1="16.2" x2="51.5" y2="23.8" stroke="#6b4d3d" stroke-width="1.1"/>
  <!-- barrel -->
  <rect x="38" y="17.2" width="8" height="5.6" fill="#473429" stroke="#221a14" stroke-width="1.4"/>
  <!-- pilot flame at the mouth -->
  <circle cx="52.8" cy="20" r="1.3" fill="#ffc247"/>
  <!-- housing -->
  <path d="M 24 12.5 L 36 14.5 L 40 17 L 40 23 L 36 25.5 L 24 27.5 A 3 3 0 0 1 21 24.5 L 21 15.5 A 3 3 0 0 1 24 12.5 Z"
        fill="#9a7a61" stroke="#38281f" stroke-width="2"/>
  <!-- top plate -->
  <path d="M 25.5 15.8 L 34 17.2 L 34 22.8 L 25.5 24.2 Z" fill="#b5937a"/>
  <!-- small fuel canister on the back -->
  <rect x="20.5" y="9.5" width="9" height="5" rx="2.2" fill="#bf5926" stroke="#38281f" stroke-width="1.5"/>
  <!-- valve wheel -->
  <circle cx="28.5" cy="20" r="2.4" fill="#e8834c" stroke="#38281f" stroke-width="1.2"/>
  <circle cx="28.5" cy="20" r="0.9" fill="#ffc247"/>
  <!-- heat shield rings on barrel root -->
  <line x1="42.5" y1="16.6" x2="42.5" y2="23.4" stroke="#221a14" stroke-width="1.2"/>
</svg>
