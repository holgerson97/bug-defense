<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32">
  <!-- Wall: armored gray-blue block, 32px footprint. Flat edges so dragged rows read as one rampart. -->
  <rect x="0" y="0" width="32" height="32" fill="#49516b"/>
  <rect x="1.5" y="1.5" width="29" height="29" fill="#737f9e"/>
  <!-- inner armor panel -->
  <rect x="5" y="5" width="22" height="22" rx="1.5" fill="#5c6685" stroke="#49516b" stroke-width="1.5"/>
  <!-- cross brace -->
  <path d="M 5.8 5.8 L 26.2 26.2 M 26.2 5.8 L 5.8 26.2" stroke="#49516b" stroke-width="3" stroke-linecap="round"/>
  <path d="M 6.5 6.5 L 25.5 25.5 M 25.5 6.5 L 6.5 25.5" stroke="#6a7492" stroke-width="1.4" stroke-linecap="round"/>
  <!-- center boss -->
  <circle cx="16" cy="16" r="4.2" fill="#737f9e" stroke="#49516b" stroke-width="1.5"/>
  <circle cx="16" cy="16" r="1.6" fill="#8a95b3"/>
  <!-- corner rivets -->
  <circle cx="3.4" cy="3.4" r="1.3" fill="#8a95b3"/>
  <circle cx="28.6" cy="3.4" r="1.3" fill="#8a95b3"/>
  <circle cx="3.4" cy="28.6" r="1.3" fill="#8a95b3"/>
  <circle cx="28.6" cy="28.6" r="1.3" fill="#8a95b3"/>
  <!-- top edge highlight -->
  <rect x="1.5" y="1.5" width="29" height="2" fill="#8a95b3" opacity="0.55"/>
</svg>
