<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 96 96">
  <!-- Gold ore: irregular rock with veins and nuggets, warm baked glow -->
  <defs>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd93b" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#ffd93b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffd93b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nugget" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe98a"/>
      <stop offset="55%" stop-color="#e8b52a"/>
      <stop offset="100%" stop-color="#a87c10"/>
    </linearGradient>
  </defs>
  <circle cx="48" cy="50" r="45" fill="url(#gglow)"/>
  <!-- rock base, irregular -->
  <path d="M 20 60 L 14 46 L 24 34 L 40 26 L 58 28 L 72 36 L 80 50 L 76 62 L 64 72 L 44 76 L 28 70 Z"
        fill="#4a4234" stroke="#2c2820" stroke-width="2.5"/>
  <path d="M 20 60 L 32 56 L 48 62 L 62 56 L 76 62 L 64 72 L 44 76 L 28 70 Z" fill="#3a3428"/>
  <!-- gold veins -->
  <path d="M 24 44 Q 38 40 46 48 Q 56 56 70 50" fill="none" stroke="#e8b52a" stroke-width="3" stroke-linecap="round"/>
  <path d="M 34 32 Q 40 42 36 52" fill="none" stroke="#c0900f" stroke-width="2.4" stroke-linecap="round"/>
  <!-- nugget clusters -->
  <path d="M 38 36 L 48 32 L 54 40 L 48 46 L 40 44 Z" fill="url(#nugget)" stroke="#8a6a0e" stroke-width="1.8"/>
  <path d="M 56 42 L 66 40 L 70 48 L 62 52 Z" fill="url(#nugget)" stroke="#8a6a0e" stroke-width="1.8"/>
  <path d="M 28 52 L 36 50 L 38 58 L 30 60 Z" fill="url(#nugget)" stroke="#8a6a0e" stroke-width="1.8"/>
  <path d="M 46 56 L 54 54 L 58 62 L 48 64 Z" fill="url(#nugget)" stroke="#8a6a0e" stroke-width="1.6"/>
  <!-- glints -->
  <circle cx="46" cy="35" r="1.8" fill="#fff7cc" opacity="0.95"/>
  <circle cx="64" cy="43" r="1.4" fill="#fff7cc" opacity="0.85"/>
  <circle cx="33" cy="53" r="1.2" fill="#fff7cc" opacity="0.8"/>
</svg>
