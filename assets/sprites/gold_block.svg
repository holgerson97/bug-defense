<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 256 256">
  <!-- Gold deposit: warm ore boulder — lustrous metallic veins and faceted nuggets in
       weathered stone. Authored 2x (512 doc / 256 viewBox). No baked halo — the deposit
       script owns the light. Thin bright highlights instead of cartoon outlines. -->
  <defs>
    <!-- stone: warm desaturated brown-grey, lit from upper left -->
    <linearGradient id="gStoneTop" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#7c7365"/>
      <stop offset="55%" stop-color="#5b5348"/>
      <stop offset="100%" stop-color="#423c33"/>
    </linearGradient>
    <linearGradient id="gStoneLow" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#4c4539"/>
      <stop offset="100%" stop-color="#2c2822"/>
    </linearGradient>
    <!-- vein luster: banded light along the seam -->
    <linearGradient id="gVein" gradientUnits="userSpaceOnUse" x1="54" y1="100" x2="200" y2="150">
      <stop offset="0%" stop-color="#8a6410"/>
      <stop offset="22%" stop-color="#e3ad25"/>
      <stop offset="42%" stop-color="#ffe27a"/>
      <stop offset="60%" stop-color="#d99f1e"/>
      <stop offset="80%" stop-color="#f5cd55"/>
      <stop offset="100%" stop-color="#7d5c10"/>
    </linearGradient>
    <!-- nugget metal: bright crest to burnished shadow -->
    <linearGradient id="gNug" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#fff2ae"/>
      <stop offset="26%" stop-color="#ffd75e"/>
      <stop offset="55%" stop-color="#e0a52c"/>
      <stop offset="84%" stop-color="#a2751a"/>
      <stop offset="100%" stop-color="#6d4c0d"/>
    </linearGradient>
    <linearGradient id="gNugLight" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fff8d2"/>
      <stop offset="50%" stop-color="#ffde75"/>
      <stop offset="100%" stop-color="#e4ad33"/>
    </linearGradient>
    <!-- warm sheen pooling around the richest seams -->
    <radialGradient id="gSheen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd75e" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffd75e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="128" cy="146" rx="96" ry="66" fill="#120e08" opacity="0.28"/>

  <!-- stone base: irregular boulder, faceted, minimal outline -->
  <path d="M 54 160 L 38 122 L 64 90 L 106 70 L 154 74 L 192 96 L 214 134 L 202 166 L 170 192 L 118 203 L 74 187 Z"
        fill="url(#gStoneTop)" stroke="#201b13" stroke-width="1.5"/>
  <!-- lower faces in shade -->
  <path d="M 54 160 L 86 152 L 122 164 L 162 154 L 202 166 L 170 192 L 118 203 L 74 187 Z" fill="url(#gStoneLow)"/>
  <path d="M 192 96 L 214 134 L 202 166 L 162 154 L 180 122 Z" fill="#544c3e" opacity="0.85"/>
  <!-- top facets catching light -->
  <path d="M 64 90 L 106 70 L 126 78 L 84 102 L 62 104 Z" fill="#8a8172" opacity="0.7"/>
  <path d="M 154 74 L 192 96 L 180 108 L 148 88 Z" fill="#786f60" opacity="0.6"/>
  <!-- cracks -->
  <path d="M 60 138 L 78 128 L 86 132" fill="none" stroke="#241f16" stroke-width="1.6" opacity="0.8"/>
  <path d="M 150 178 L 166 168 L 184 170" fill="none" stroke="#241f16" stroke-width="1.5" opacity="0.7"/>
  <path d="M 174 112 Q 184 126 178 142" fill="none" stroke="#2c261c" stroke-width="1.4" opacity="0.7"/>
  <!-- rim light on the lit edge -->
  <path d="M 38 122 L 64 90 L 106 70 L 154 74" fill="none" stroke="#a99f8c" stroke-width="1.6" opacity="0.8"/>
  <!-- rubble -->
  <path d="M 40 150 L 50 144 L 56 152 L 46 158 Z" fill="#52493b"/>
  <path d="M 206 150 L 216 144 L 222 152 L 212 158 Z" fill="#463e32"/>
  <path d="M 104 204 L 114 200 L 118 208 L 108 211 Z" fill="#3a332a"/>

  <!-- warm sheen where the metal concentrates -->
  <ellipse cx="126" cy="122" rx="70" ry="42" fill="url(#gSheen)"/>

  <!-- ============ VEINS ============ -->
  <!-- seams sit IN the rock: dark recess underlay first, jagged gold stringer on top -->
  <path d="M 62 118 L 84 110 L 98 116 L 112 112 L 126 124 L 142 136 L 160 134 L 186 130"
        fill="none" stroke="#1f1a10" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
  <path d="M 62 118 L 84 110 L 98 116 L 112 112 L 126 124 L 142 136 L 160 134 L 186 130"
        fill="none" stroke="url(#gVein)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 84 110 L 98 116 L 112 112" fill="none" stroke="#ffe98c" stroke-width="1.3" stroke-linecap="round" opacity="0.8"/>
  <path d="M 142 136 L 160 134" fill="none" stroke="#ffe98c" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <!-- branch seam -->
  <path d="M 94 88 L 102 102 L 98 118 L 104 132 L 98 144"
        fill="none" stroke="#1f1a10" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <path d="M 94 88 L 102 102 L 98 118 L 104 132 L 98 144"
        fill="none" stroke="url(#gVein)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 138 168 L 152 162 L 162 166 L 174 162"
        fill="none" stroke="#1f1a10" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <path d="M 138 168 L 152 162 L 162 166 L 174 162"
        fill="none" stroke="url(#gVein)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- hairline stringers -->
  <path d="M 70 132 L 78 140 L 76 152" fill="none" stroke="#caa235" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
  <path d="M 160 100 L 170 106 L 176 116" fill="none" stroke="#caa235" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>

  <!-- ============ NUGGETS ============ -->
  <!-- irregular lumps seated in dark recesses, angular facet slivers, thin bright crests -->
  <!-- big center nugget -->
  <path d="M 96 96 L 112 86 L 126 90 L 134 104 L 128 120 L 112 124 L 99 114 Z" fill="#1f1a10" opacity="0.8" transform="translate(2.5,3)"/>
  <path d="M 96 96 L 112 86 L 126 90 L 134 104 L 128 120 L 112 124 L 99 114 Z" fill="url(#gNug)"/>
  <path d="M 96 96 L 112 86 L 118 96 L 104 104 Z" fill="url(#gNugLight)"/>
  <path d="M 118 96 L 126 90 L 134 104 L 124 106 Z" fill="#c8922a" opacity="0.9"/>
  <path d="M 128 120 L 134 104 L 124 106 L 118 118 Z" fill="#8a6210" opacity="0.85"/>
  <path d="M 96 96 L 112 86 L 126 90" fill="none" stroke="#fff6c4" stroke-width="1.3" opacity="0.9"/>
  <!-- right nugget -->
  <path d="M 152 112 L 168 105 L 180 112 L 182 124 L 168 132 L 155 126 Z" fill="#1f1a10" opacity="0.8" transform="translate(2,2.5)"/>
  <path d="M 152 112 L 168 105 L 180 112 L 182 124 L 168 132 L 155 126 Z" fill="url(#gNug)"/>
  <path d="M 152 112 L 168 105 L 172 114 L 158 120 Z" fill="url(#gNugLight)"/>
  <path d="M 182 124 L 180 112 L 172 114 L 174 126 Z" fill="#8a6210" opacity="0.8"/>
  <path d="M 152 112 L 168 105" fill="none" stroke="#fff6c4" stroke-width="1.1" opacity="0.85"/>
  <!-- lower-left nugget -->
  <path d="M 70 140 L 84 132 L 94 138 L 94 150 L 82 158 L 72 152 Z" fill="#1f1a10" opacity="0.8" transform="translate(2,2.5)"/>
  <path d="M 70 140 L 84 132 L 94 138 L 94 150 L 82 158 L 72 152 Z" fill="url(#gNug)"/>
  <path d="M 70 140 L 84 132 L 87 140 L 75 146 Z" fill="url(#gNugLight)"/>
  <path d="M 94 150 L 94 138 L 87 140 L 88 150 Z" fill="#8a6210" opacity="0.8"/>
  <path d="M 70 140 L 84 132" fill="none" stroke="#fff6c4" stroke-width="1.0" opacity="0.8"/>
  <!-- lower-center nugget -->
  <path d="M 120 148 L 134 142 L 146 148 L 148 160 L 134 168 L 122 160 Z" fill="#1f1a10" opacity="0.8" transform="translate(2,2.5)"/>
  <path d="M 120 148 L 134 142 L 146 148 L 148 160 L 134 168 L 122 160 Z" fill="url(#gNug)"/>
  <path d="M 120 148 L 134 142 L 138 150 L 126 156 Z" fill="url(#gNugLight)"/>
  <path d="M 148 160 L 146 148 L 138 150 L 140 160 Z" fill="#8a6210" opacity="0.8"/>
  <path d="M 120 148 L 134 142" fill="none" stroke="#fff6c4" stroke-width="1.0" opacity="0.8"/>
  <!-- small flecks -->
  <circle cx="82" cy="112" r="2.6" fill="#f2c650" opacity="0.85"/>
  <circle cx="146" cy="94" r="2.2" fill="#f2c650" opacity="0.8"/>
  <circle cx="182" cy="146" r="2.4" fill="#e8b83e" opacity="0.8"/>
  <circle cx="108" cy="178" r="2.0" fill="#d8a830" opacity="0.75"/>
  <circle cx="58" cy="128" r="1.8" fill="#e8b83e" opacity="0.7"/>

  <!-- specular glints -->
  <path d="M 116 86 L 117.6 91.4 L 123 93 L 117.6 94.6 L 116 100 L 114.4 94.6 L 109 93 L 114.4 91.4 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M 170 106 L 171.2 109.8 L 175 111 L 171.2 112.2 L 170 116 L 168.8 112.2 L 165 111 L 168.8 109.8 Z" fill="#ffffff" opacity="0.85"/>
  <circle cx="88" cy="134" r="1.8" fill="#fffbe0" opacity="0.9"/>
  <circle cx="130" cy="145" r="1.6" fill="#fffbe0" opacity="0.85"/>
  <circle cx="121" cy="122" r="1.4" fill="#fff3b8" opacity="0.8"/>
</svg>
