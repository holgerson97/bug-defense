<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 96 96">
  <!-- Engineer marine: cyan-teal builder, top-down, facing right (+x). Tool emitter and utility rig. -->
  <!-- thruster glow -->
  <ellipse cx="13" cy="41" rx="6" ry="3.2" fill="#7fe8de" opacity="0.75"/>
  <ellipse cx="13" cy="55" rx="6" ry="3.2" fill="#7fe8de" opacity="0.75"/>
  <!-- utility rig backpack with dish -->
  <rect x="14" y="30" width="18" height="36" rx="5" fill="#1d5c5c" stroke="#0c2e2e" stroke-width="2"/>
  <circle cx="23" cy="38" r="5" fill="#2e8f87" stroke="#0c2e2e" stroke-width="1.6"/>
  <circle cx="23" cy="38" r="2" fill="#7fe8de"/>
  <!-- wrench strapped across the pack -->
  <rect x="16" y="52" width="14" height="3" rx="1.5" fill="#8a97a5" transform="rotate(-18 23 53.5)"/>
  <circle cx="17.5" cy="55.5" r="2.6" fill="none" stroke="#8a97a5" stroke-width="2"/>
  <!-- tool emitter (short, wide, glowing tip) -->
  <rect x="52" y="43.5" width="18" height="9" rx="2.4" fill="#3a3f47" stroke="#20242a" stroke-width="1.5"/>
  <rect x="68" y="41.5" width="6" height="13" rx="2" fill="#20242a"/>
  <circle cx="74" cy="48" r="2.6" fill="#7fe8de"/>
  <!-- arms -->
  <rect x="43" y="32" width="16" height="7.5" rx="3.6" fill="#1d5c5c" stroke="#0c2e2e" stroke-width="1.6" transform="rotate(24 43 35.5)"/>
  <rect x="43" y="56" width="16" height="7.5" rx="3.6" fill="#1d5c5c" stroke="#0c2e2e" stroke-width="1.6" transform="rotate(-24 43 60)"/>
  <!-- rounded pauldrons with hazard stripes -->
  <ellipse cx="38" cy="29" rx="13" ry="8.5" fill="#2e8f87" stroke="#0c2e2e" stroke-width="2"/>
  <ellipse cx="38" cy="67" rx="13" ry="8.5" fill="#2e8f87" stroke="#0c2e2e" stroke-width="2"/>
  <path d="M 30 24 L 34 22 M 36 23 L 40 21" stroke="#ffd93b" stroke-width="2"/>
  <path d="M 30 72 L 34 74 M 36 73 L 40 75" stroke="#ffd93b" stroke-width="2"/>
  <!-- torso with tool harness -->
  <ellipse cx="43" cy="48" rx="16" ry="14" fill="#256d68" stroke="#0c2e2e" stroke-width="2"/>
  <path d="M 34 40 L 44 48 L 34 56" fill="none" stroke="#1d5c5c" stroke-width="3"/>
  <path d="M 41 39 L 52 48 L 41 57" fill="none" stroke="#7fe8de" stroke-width="2.4"/>
  <!-- belt pouches -->
  <rect x="33" y="58" width="5" height="4" rx="1" fill="#ffd93b"/>
  <rect x="40" y="60" width="5" height="4" rx="1" fill="#ffd93b"/>
  <!-- helmet with headlamp -->
  <circle cx="57" cy="48" r="9.5" fill="#2e8f87" stroke="#0c2e2e" stroke-width="2"/>
  <path d="M 57 39 A 9 9 0 0 1 57 57" fill="none" stroke="#1d5c5c" stroke-width="3"/>
  <path d="M 63.5 43.5 A 7.5 7.5 0 0 1 63.5 52.5" fill="none" stroke="#ffe98a" stroke-width="2.6"/>
  <circle cx="60" cy="40" r="2" fill="#ffe98a"/>
</svg>
