<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Brute: slow armored tank enemy, top-down, facing right (+x) -->
  <g stroke="#2e1038" stroke-width="3" stroke-linecap="round">
    <line x1="22" y1="21" x2="13" y2="12"/>
    <line x1="22" y1="43" x2="13" y2="52"/>
    <line x1="36" y1="19" x2="34" y2="9"/>
    <line x1="36" y1="45" x2="34" y2="55"/>
  </g>
  <!-- crusher claws -->
  <path d="M 48 24 Q 59 18 63 23 Q 57 27 51 30 Z" fill="#4a1a5c"/>
  <path d="M 48 40 Q 59 46 63 41 Q 57 37 51 34 Z" fill="#4a1a5c"/>
  <!-- armored shell -->
  <ellipse cx="28" cy="32" rx="18" ry="14" fill="#5d2373"/>
  <!-- armor plates -->
  <path d="M 15 23 Q 18 32 15 41" fill="none" stroke="#2e1038" stroke-width="2.5"/>
  <path d="M 23 20 Q 26 32 23 44" fill="none" stroke="#2e1038" stroke-width="2.5"/>
  <path d="M 31 19 Q 34 32 31 45" fill="none" stroke="#2e1038" stroke-width="2.5"/>
  <!-- ridge studs -->
  <circle cx="19" cy="27" r="1.8" fill="#8a4aa3"/>
  <circle cx="19" cy="37" r="1.8" fill="#8a4aa3"/>
  <circle cx="27" cy="25" r="1.8" fill="#8a4aa3"/>
  <circle cx="27" cy="39" r="1.8" fill="#8a4aa3"/>
  <!-- head -->
  <circle cx="47" cy="32" r="7.5" fill="#4a1a5c"/>
  <!-- eyes -->
  <circle cx="50" cy="28" r="2" fill="#ffb3c0"/>
  <circle cx="50" cy="36" r="2" fill="#ffb3c0"/>
  <!-- highlight -->
  <ellipse cx="24" cy="25" rx="5" ry="3" fill="#8a4aa3" opacity="0.6"/>
</svg>
