<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 256 256">
  <!-- Boss: giant cockroach, top-down, facing right (+x). Glossy brown carapace,
       long antennae, spiny legs, wing covers parted at the rear. -->
  <!-- legs: three pairs, spiky -->
  <g stroke="#3d2413" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M 96 100 Q 62 66 40 54"/>
    <path d="M 96 156 Q 62 190 40 202"/>
    <path d="M 128 92 Q 116 56 104 34"/>
    <path d="M 128 164 Q 116 200 104 222"/>
    <path d="M 162 96 Q 168 62 180 40"/>
    <path d="M 162 160 Q 168 194 180 216"/>
  </g>
  <g stroke="#241408" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M 46 58 L 34 50"/>
    <path d="M 46 198 L 34 206"/>
    <path d="M 106 40 L 98 26"/>
    <path d="M 106 216 L 98 230"/>
    <path d="M 176 46 L 186 32"/>
    <path d="M 176 210 L 186 224"/>
  </g>
  <!-- antennae: long, swept back -->
  <g stroke="#3d2413" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M 210 112 Q 250 88 252 56"/>
    <path d="M 210 144 Q 250 168 252 200"/>
  </g>
  <!-- abdomen under the wing covers (rear tip) -->
  <ellipse cx="74" cy="128" rx="38" ry="30" fill="#5a3319"/>
  <path d="M 44 118 Q 52 128 44 138" fill="none" stroke="#3d2413" stroke-width="4"/>
  <!-- cerci (rear spikes) -->
  <path d="M 42 116 L 20 102" stroke="#3d2413" stroke-width="6" stroke-linecap="round"/>
  <path d="M 42 140 L 20 154" stroke="#3d2413" stroke-width="6" stroke-linecap="round"/>
  <!-- wing covers: two long glossy tegmina, parted slightly -->
  <path d="M 66 122 Q 60 84 96 74 Q 160 62 196 100 Q 200 112 198 122 L 130 126 Z"
        fill="#7a4a22" stroke="#3d2413" stroke-width="5"/>
  <path d="M 66 134 Q 60 172 96 182 Q 160 194 196 156 Q 200 144 198 134 L 130 130 Z"
        fill="#6b3f1c" stroke="#3d2413" stroke-width="5"/>
  <!-- wing veins -->
  <path d="M 84 96 Q 140 84 186 108" fill="none" stroke="#5a3319" stroke-width="3.5"/>
  <path d="M 84 160 Q 140 172 186 148" fill="none" stroke="#4a2c12" stroke-width="3.5"/>
  <!-- glossy highlight -->
  <path d="M 92 88 Q 138 76 176 96" fill="none" stroke="#a5713a" stroke-width="6" opacity="0.7" stroke-linecap="round"/>
  <!-- pronotum (head shield) -->
  <ellipse cx="188" cy="128" rx="30" ry="34" fill="#8a5426" stroke="#3d2413" stroke-width="5"/>
  <ellipse cx="182" cy="118" rx="12" ry="8" fill="#a5713a" opacity="0.7"/>
  <!-- head peeking out -->
  <ellipse cx="216" cy="128" rx="16" ry="14" fill="#5a3319" stroke="#3d2413" stroke-width="4"/>
  <!-- mandibles -->
  <path d="M 228 118 Q 244 110 250 114 Q 242 122 232 126 Z" fill="#3d2413"/>
  <path d="M 228 138 Q 244 146 250 142 Q 242 134 232 130 Z" fill="#3d2413"/>
  <!-- eyes: glowing amber -->
  <circle cx="220" cy="119" r="5" fill="#ffb03d"/>
  <circle cx="220" cy="137" r="5" fill="#ffb03d"/>
  <circle cx="221.5" cy="117.5" r="2" fill="#ffe9c4"/>
  <circle cx="221.5" cy="135.5" r="2" fill="#ffe9c4"/>
</svg>
