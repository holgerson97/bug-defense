<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Drone: slow heavily-armored flying tank, top-down, facing right (+x) -->
  <!-- twin rotor wing pairs -->
  <ellipse cx="38" cy="27" rx="19" ry="7" fill="#aab6a2" opacity="0.4" transform="rotate(-14 38 27)"/>
  <ellipse cx="38" cy="69" rx="19" ry="7" fill="#aab6a2" opacity="0.4" transform="rotate(14 38 69)"/>
  <ellipse cx="56" cy="28" rx="15" ry="6" fill="#aab6a2" opacity="0.35" transform="rotate(-22 56 28)"/>
  <ellipse cx="56" cy="68" rx="15" ry="6" fill="#aab6a2" opacity="0.35" transform="rotate(22 56 68)"/>
  <!-- rear thruster spike -->
  <path d="M 16 48 L 3 44 L 3 52 Z" fill="#2c332a"/>
  <path d="M 8 46.5 L 3 44 L 3 52 L 8 49.5 Z" fill="#d98f33"/>
  <!-- armored abdomen -->
  <ellipse cx="34" cy="48" rx="20" ry="15" fill="#5c6b54"/>
  <!-- plate seams -->
  <path d="M 20 38 Q 24 48 20 58" fill="none" stroke="#2c332a" stroke-width="3"/>
  <path d="M 29 35 Q 33 48 29 61" fill="none" stroke="#2c332a" stroke-width="3"/>
  <path d="M 38 34.5 Q 42 48 38 61.5" fill="none" stroke="#2c332a" stroke-width="3"/>
  <!-- rivets -->
  <circle cx="24" cy="42" r="2" fill="#8ea083"/>
  <circle cx="24" cy="54" r="2" fill="#8ea083"/>
  <circle cx="33" cy="40" r="2" fill="#8ea083"/>
  <circle cx="33" cy="56" r="2" fill="#8ea083"/>
  <!-- thorax plate -->
  <ellipse cx="55" cy="48" rx="11" ry="10.5" fill="#6d7d63"/>
  <path d="M 55 38.5 L 55 57.5" stroke="#2c332a" stroke-width="2.5"/>
  <!-- side armor skirts -->
  <path d="M 46 36 Q 56 32 64 37 L 58 41 Q 51 38 46 39 Z" fill="#414c3b"/>
  <path d="M 46 60 Q 56 64 64 59 L 58 55 Q 51 58 46 57 Z" fill="#414c3b"/>
  <!-- head -->
  <circle cx="71" cy="48" r="8" fill="#414c3b"/>
  <!-- mandibles -->
  <path d="M 76 42 Q 87 38 91 42 Q 84 45 78 47 Z" fill="#2c332a"/>
  <path d="M 76 54 Q 87 58 91 54 Q 84 51 78 49 Z" fill="#2c332a"/>
  <!-- eyes -->
  <circle cx="74" cy="44.5" r="2.4" fill="#ffb347"/>
  <circle cx="74" cy="51.5" r="2.4" fill="#ffb347"/>
  <!-- highlight -->
  <ellipse cx="29" cy="40" rx="6" ry="3.5" fill="#8ea083" opacity="0.6"/>
</svg>
