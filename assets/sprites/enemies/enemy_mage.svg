<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Mage: deep-blue summoner with glowing orb, top-down, facing right (+x) -->
  <!-- magic aura -->
  <circle cx="30" cy="32" r="23" fill="#7a6cff" opacity="0.12"/>
  <!-- trailing robe/tendrils -->
  <path d="M 20 32 Q 12 24 4 27 Q 12 30 14 32 Q 12 34 4 37 Q 12 40 20 32 Z" fill="#2c2470"/>
  <g stroke="#1b1550" stroke-width="2.5" stroke-linecap="round">
    <line x1="26" y1="23" x2="19" y2="14"/>
    <line x1="26" y1="41" x2="19" y2="50"/>
  </g>
  <!-- body -->
  <ellipse cx="28" cy="32" rx="13" ry="10" fill="#3b309c"/>
  <!-- rune marks -->
  <path d="M 23 27 L 27 32 L 23 37" fill="none" stroke="#9d92ff" stroke-width="1.8"/>
  <path d="M 30 26 L 34 32 L 30 38" fill="none" stroke="#9d92ff" stroke-width="1.8"/>
  <!-- head with hood -->
  <circle cx="43" cy="32" r="6.5" fill="#2c2470"/>
  <path d="M 39 26 Q 45 22 49 27 L 46 32 Q 43 28 40 30 Z" fill="#1b1550"/>
  <!-- eyes -->
  <circle cx="45" cy="30" r="1.7" fill="#b7aeff"/>
  <circle cx="45" cy="35" r="1.7" fill="#b7aeff"/>
  <!-- summoning orb held in front -->
  <circle cx="56" cy="32" r="5" fill="#7a6cff" opacity="0.5"/>
  <circle cx="56" cy="32" r="3" fill="#b7aeff"/>
  <circle cx="56" cy="32" r="1.4" fill="#ffffff"/>
</svg>
