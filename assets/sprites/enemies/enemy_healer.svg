<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Healer: teal support bug with glowing cross, top-down, facing right (+x) -->
  <!-- healing aura -->
  <circle cx="30" cy="32" r="22" fill="#5ce8b0" opacity="0.15"/>
  <g stroke="#0f5c44" stroke-width="2.5" stroke-linecap="round">
    <line x1="24" y1="23" x2="16" y2="15"/>
    <line x1="24" y1="41" x2="16" y2="49"/>
    <line x1="34" y1="21" x2="30" y2="11"/>
    <line x1="34" y1="43" x2="30" y2="53"/>
  </g>
  <!-- abdomen -->
  <ellipse cx="26" cy="32" rx="14" ry="11" fill="#1d9c72"/>
  <!-- carapace cross -->
  <rect x="22" y="26" width="8" height="12" rx="1.5" fill="#c8ffe8" transform="rotate(90 26 32)"/>
  <rect x="22" y="26" width="8" height="12" rx="1.5" fill="#c8ffe8"/>
  <!-- thorax -->
  <circle cx="40" cy="32" r="7.5" fill="#2bb887"/>
  <!-- head -->
  <circle cx="49" cy="32" r="5.5" fill="#1d9c72"/>
  <!-- antennae with sensor tips -->
  <path d="M 52 28 Q 57 24 60 25" fill="none" stroke="#0f5c44" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 52 36 Q 57 40 60 39" fill="none" stroke="#0f5c44" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="60" cy="25" r="1.6" fill="#5ce8b0"/>
  <circle cx="60" cy="39" r="1.6" fill="#5ce8b0"/>
  <!-- eyes -->
  <circle cx="51" cy="29" r="1.5" fill="#05291e"/>
  <circle cx="51" cy="35" r="1.5" fill="#05291e"/>
</svg>
