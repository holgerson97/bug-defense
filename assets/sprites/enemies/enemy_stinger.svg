<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Stinger: fast wasp-like enemy, top-down, facing right (+x) -->
  <!-- wings -->
  <ellipse cx="28" cy="21" rx="12" ry="5" fill="#ffd98a" opacity="0.45" transform="rotate(-18 28 21)"/>
  <ellipse cx="28" cy="43" rx="12" ry="5" fill="#ffd98a" opacity="0.45" transform="rotate(18 28 43)"/>
  <!-- stinger tail -->
  <path d="M 12 32 L 2 32 L 13 28.5 Z" fill="#7a4a10"/>
  <!-- abdomen -->
  <ellipse cx="20" cy="32" rx="10" ry="7" fill="#e8952e"/>
  <path d="M 15 26.5 Q 17 32 15 37.5" fill="none" stroke="#7a4a10" stroke-width="2"/>
  <path d="M 21 25.5 Q 23 32 21 38.5" fill="none" stroke="#7a4a10" stroke-width="2"/>
  <!-- thorax -->
  <ellipse cx="35" cy="32" rx="8" ry="6.5" fill="#f5a93d"/>
  <!-- head -->
  <circle cx="46" cy="32" r="5.5" fill="#e8952e"/>
  <!-- antennae -->
  <path d="M 49 28 Q 55 24 59 25" fill="none" stroke="#7a4a10" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 49 36 Q 55 40 59 39" fill="none" stroke="#7a4a10" stroke-width="1.8" stroke-linecap="round"/>
  <!-- eyes -->
  <circle cx="48" cy="29.5" r="1.6" fill="#2b1804"/>
  <circle cx="48" cy="34.5" r="1.6" fill="#2b1804"/>
  <!-- highlight -->
  <ellipse cx="33" cy="28.5" rx="3.5" ry="2" fill="#ffd98a" opacity="0.8"/>
</svg>
