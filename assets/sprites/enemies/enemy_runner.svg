<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Baby runner: tiny fast mite summoned by the mage, top-down, facing right (+x) -->
  <g stroke="#6b1420" stroke-width="1.6" stroke-linecap="round">
    <line x1="12" y1="12" x2="7" y2="7"/>
    <line x1="12" y1="20" x2="7" y2="25"/>
    <line x1="17" y1="11" x2="15" y2="5"/>
    <line x1="17" y1="21" x2="15" y2="27"/>
  </g>
  <!-- speed streaks -->
  <line x1="8" y1="14" x2="2" y2="13" stroke="#e6707e" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
  <line x1="8" y1="18" x2="2" y2="19" stroke="#e6707e" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="14" cy="16" rx="7" ry="5.5" fill="#d9394a"/>
  <!-- head -->
  <circle cx="23" cy="16" r="3.5" fill="#b02838"/>
  <!-- tiny mandibles -->
  <path d="M 25 14 L 29 12.5 L 26 15.5 Z" fill="#8f1f2c"/>
  <path d="M 25 18 L 29 19.5 L 26 16.5 Z" fill="#8f1f2c"/>
  <!-- eyes -->
  <circle cx="24" cy="14.5" r="0.9" fill="#2a0a10"/>
  <circle cx="24" cy="17.5" r="0.9" fill="#2a0a10"/>
  <!-- highlight -->
  <ellipse cx="12" cy="14" rx="2.5" ry="1.5" fill="#f07080" opacity="0.7"/>
</svg>
